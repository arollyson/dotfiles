# Terminal
# tmux-256color is the correct entry but is missing from older/minimal
# terminfo databases, so fall back rather than leaving panes unusable.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ',*256col*:Tc'

# No default-command: leaving it unset makes tmux start the user's shell as a
# login shell, which is what runs .zprofile. Hardcoding a shell name here also
# kills every pane on a host where that shell isn't on PATH.

set-option -g set-titles on
set-option -g set-titles-string '#W'

# Status Bar
set -g status-bg black
set -g status-fg white
set -g status-interval 1
set -g status-left '#[fg=green]#H#[default]'
set -g status-right '#[fg=cyan,bold]%Y-%m-%d %H:%M:%S#[default]'

# Clock
setw -g clock-mode-colour green
setw -g clock-mode-style 24

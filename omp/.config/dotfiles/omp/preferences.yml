# Public defaults. Installation seeds missing local settings; omp-sync.sh is opt-in.
modelRoles:
  default: anthropic/claude-opus-5-5:high
  plan: '@default'
  slow: '@default'
  task: '@default'
  smol: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:low
  review: openai-codex/gpt-6-astra:high
  advisor: openai-codex/gpt-6.1-sol:medium
  security: litellm/databricks-glm-5-3:high
  security-fast: litellm/databricks-glm-5-3-flash:low
task:
  agentModelOverrides:
    task: '@task'
    scout: '@smol'
    sonic: '@smol'
    reviewer: '@review'
    security-reviewer: '@review'
  eager: preferred
advisor:
  enabled: true
  syncBacklog: '3'
retry:
  modelFallback: true
  fallbackChains:
    default: [litellm/claude-opus-5-5, openai-codex/gpt-6.1-sol:high, litellm/gpt-6.1-sol]
    plan: [litellm/claude-opus-5-5, openai-codex/gpt-6.1-sol:high, litellm/gpt-6.1-sol]
    slow: [litellm/claude-opus-5-5, openai-codex/gpt-6.1-sol:high, litellm/gpt-6.1-sol]
    task: [litellm/claude-opus-5-5, openai-codex/gpt-6.1-sol:high, litellm/gpt-6.1-sol]
    review: [litellm/gpt-6-astra, anthropic/claude-opus-5-5:high, litellm/claude-opus-5-5]
    smol: [litellm/gpt-6-luna, anthropic/claude-sonnet-5-5:low, litellm/claude-sonnet-5-5]
    tiny: [litellm/gpt-6-luna, anthropic/claude-sonnet-5-5:low, litellm/claude-sonnet-5-5]
    advisor: [litellm/gpt-6.1-sol, anthropic/claude-sonnet-5-5:medium, litellm/claude-sonnet-5-5]
    security: [litellm/databricks-glm-5-3-flash:low]
    security-fast: [litellm/databricks-glm-5-3:high]
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: cyberpunk-readable
  light: cyberpunk-readable
setupVersion: 2
dev:
  autoqaConsent: denied
  autoqa: false
github:
  enabled: true
astGrep:
  enabled: true
plan:
  autosave: true
secrets:
  enabled: true
security:
  enabled: true
modelRoleStorage: global
memory:
  backend: 'off'
autolearn:
  enabled: false
  autoContinue: false
hideThinkingBlock: false

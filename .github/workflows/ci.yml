---
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends zsh 2>/dev/null ||
            { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh; }

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/prek/hooks
            ~/.cache/prek/repos
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      - name: Install prek
        env:
          PREK_VERSION: v0.4.12
          PREK_SHA256: f2476eae75463f96dd26c78466c4e8f42031ff99214abf3d208f1cf04a0e4ddf
        run: |
          set -euo pipefail
          asset=prek-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL -o "$asset" \
            "https://github.com/j178/prek/releases/download/${PREK_VERSION}/${asset}"
          echo "${PREK_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" --strip-components=1
          sudo install -m755 prek /usr/local/bin/prek

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install zsh and stow
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends zsh stow 2>/dev/null ||
              { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh stow; }
          else
            # Without this brew runs a full self-update first, which takes far
            # longer than installing stow does.
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
            command -v stow >/dev/null 2>&1 || brew install stow
          fi

      - name: Run test suite
        run: ./tests/run.sh
